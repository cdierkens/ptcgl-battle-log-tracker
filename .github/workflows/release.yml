name: Release

# Tag-triggered release. To cut one:
#
#   1. Bump the version in package.json, src-tauri/Cargo.toml and
#      src-tauri/tauri.conf.json — they must agree, and the check below enforces
#      that the tag matches tauri.conf.json.
#   2. Commit and push, then tag: git tag v0.2.0 && git push origin v0.2.0
#
# Builds are unsigned: macOS is ad-hoc signed and Gatekeeper flags it; the
# Windows installers are unsigned and SmartScreen flags them. Signing and the
# Tauri updater are later work. docs/specs/2026-10-17-mvp-release.md records the
# macOS v0.1.0 shape; the Windows binaries ship with the Windows support spec.
#
# The release is created as a draft. Review it under Releases, then publish.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  # Creates the draft release, and fails fast if the tag and app version drift.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the bundled version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${version}"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --draft

  macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: rustup target add aarch64-apple-darwin
      - run: pnpm tauri build --target aarch64-apple-darwin

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          # Release assets are files, not directories, so the .app ships zipped.
          ditto -c -k --sequesterRsrc --keepParent \
            "${bundle}/macos/PTCGL Tracker.app" \
            "PTCGL Tracker_${version}_aarch64.app.zip"
          gh release upload "${GITHUB_REF_NAME}" \
            "${bundle}"/dmg/*.dmg \
            "PTCGL Tracker_${version}_aarch64.app.zip" \
            --clobber

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: rustup target add x86_64-pc-windows-msvc
      # bundle.targets = "all" yields both the WiX .msi and the NSIS setup .exe.
      # If WiX proves flaky on the runner, pass --bundles nsis to drop the .msi.
      - run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $bundle = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $files = Get-ChildItem "$bundle\msi\*.msi", "$bundle\nsis\*.exe"
          gh release upload "$env:GITHUB_REF_NAME" $files.FullName --clobber
