[package]
name = "ptcgl-battle-log-capture"
version = "0.3.1"
edition = "2021"

[lib]
name = "ptcgl_battle_log_capture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production builds embed ../dist and skip devUrl. `tauri build` turns this on;
# a bare `cargo build --release` must pass it explicitly.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
xcap = { version = "0.9", features = ["wgc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
unicode-normalization = "0.1"
trash = "5"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "charset", "http2", "system-proxy"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-vision = "0.3.2"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSResponder", "NSWindow", "NSWorkspace"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

# xcap copies and swizzles each frame per pixel; unoptimised that makes dev polls ~10x slower.
# Only the hot crates: optimising every dependency made CI ~8x slower.
[profile.dev.package.xcap]
opt-level = 3

[profile.dev.package.image]
opt-level = 3
